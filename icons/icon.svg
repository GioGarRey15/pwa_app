<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Outer Pulse Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.3" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.8" filter="url(#glow)" />

  <!-- Dumbbell Icon -->
  <g transform="translate(136, 136) scale(0.95)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="70" y="115" width="110" height="20" rx="6" fill="#f43f5e" />
    
    <!-- Left Weights -->
    <rect x="50" y="80" width="20" height="90" rx="6" fill="url(#accentGrad)" />
    <rect x="30" y="95" width="20" height="60" rx="4" fill="#fb7185" />
    <rect x="15" y="105" width="15" height="40" rx="3" fill="#cbd5e1" />
    
    <!-- Right Weights -->
    <rect x="180" y="80" width="20" height="90" rx="6" fill="url(#accentGrad)" />
    <rect x="200" y="95" width="20" height="60" rx="4" fill="#fb7185" />
    <rect x="220" y="105" width="15" height="40" rx="3" fill="#cbd5e1" />
  </g>

  <!-- Pulse Line Wave -->
  <path d="M 90 360 L 170 360 L 195 320 L 225 410 L 260 300 L 295 390 L 320 360 L 420 360" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
